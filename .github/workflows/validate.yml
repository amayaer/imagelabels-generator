name: Terraform Validation/CI

on: 
  push: 
    branches: 
      - main          
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs: 
    validate: 
        runs-on: ubuntu-latest
        steps: 
            - name: checkout
              uses: actions/checkout@v4
            
            - uses: hashicorp/setup-terraform@v3
              with: 
                terraform_version: 1.9.0

            - name: Format check
              run: terraform fmt -check

            - name: Terraform Init 
              working-directory: ./terraform
              run: terraform init -backend=false

            - name: Validate
              run: terraform validate 

            - name: TFlint
              uses: terraform-linters/setup-tflint@v4
            
            - name: Run TFlint 
              run: tflint --init && tflint

            - name: Checkov 
              uses: bridgecrewio/checkov-action@master
              with: 
                directory: ./terraform
                framework: terraform
                quiet: true
                soft_fail: true

            - name: Configure AWS credentials - OICD
              uses: aws-actions/configure-aws-credentials@v4
              with: 
                role-to-assume: arn:aws:iam::277328279133:role/github-actions-openID
                aws-region: us-east-1

            - name: Terraform Plan
              working-directory: ./terraform 
              run: terraform plan






